<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gates of Moria</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #03030e; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  svg { width: min(480px, 95vw); height: auto; display: block; }
</style>
</head>
<body>
<svg viewBox="0 0 500 680" xmlns="http://www.w3.org/2000/svg" fill="none">
<defs>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="2.8" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow-strong" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <!-- Arch text paths — sweep=0 draws the upper arc (over the top) -->
  <path id="a1" d="M 53,322 A 197,197 0 0,0 447,322"/>
  <path id="a2" d="M 75,322 A 175,175 0 0,0 425,322"/>
  <path id="a3" d="M 91,322 A 159,159 0 0,0 409,322"/>
</defs>

<!-- Background -->
<rect width="500" height="680" fill="#03030e"/>

<!-- ═══ ARCH ═══ -->
<g filter="url(#glow)" stroke="white" fill="none">
  <path d="M 53,322 A 197,197 0 0,0 447,322" stroke-width="3"/>
  <path d="M 75,322 A 175,175 0 0,0 425,322" stroke-width="1.6"/>
  <path d="M 91,322 A 159,159 0 0,0 409,322" stroke-width="1.1"/>
</g>

<!-- Corner scroll ornaments -->
<g filter="url(#glow)" stroke="white" fill="none" stroke-linecap="round">
  <path d="M 53,322 C 42,314 38,302 44,290 C 49,280 60,278 67,285 C 74,292 72,303 65,307 C 59,310 52,306 53,299" stroke-width="1.8"/>
  <path d="M 44,290 C 40,284 36,274 40,266" stroke-width="1.5"/>
  <path d="M 447,322 C 458,314 462,302 456,290 C 451,280 440,278 433,285 C 426,292 428,303 435,307 C 441,310 448,306 447,299" stroke-width="1.8"/>
  <path d="M 456,290 C 460,284 464,274 460,266" stroke-width="1.5"/>
</g>

<!-- Arch inscription text -->
<g filter="url(#glow)">
  <text font-family="Palatino Linotype, Palatino, Book Antiqua, Georgia, serif" font-size="7.4" fill="white" font-style="italic" letter-spacing="1.2">
    <textPath href="#a1" startOffset="2%">Ennyn Durin Aran Moria: pedo mellon a minno · Im Narvi hain echant · Celebrimbor o Eregion ·</textPath>
  </text>
  <text font-family="Palatino Linotype, Palatino, Book Antiqua, Georgia, serif" font-size="6.6" fill="white" font-style="italic" letter-spacing="0.9">
    <textPath href="#a2" startOffset="3%">teithant i thiw hin · ennyn Durin Aran Moria · pedo mellon a minno · Im Narvi hain echant ·</textPath>
  </text>
  <text font-family="Palatino Linotype, Palatino, Book Antiqua, Georgia, serif" font-size="5.8" fill="white" font-style="italic" letter-spacing="0.5">
    <textPath href="#a3" startOffset="5%">Celebrimbor o Eregion teithant i thiw hin · ennyn Durin aran Moria · pedo mellon a minno ·</textPath>
  </text>
</g>

<!-- ═══ LEFT COLUMN ═══ -->
<g filter="url(#glow)" stroke="white" fill="none">
  <!-- Capital top plate -->
  <rect x="36" y="308" width="68" height="16" rx="2" stroke-width="2.2"/>
  <!-- Volute scrolls on capital -->
  <path d="M 36,324 C 26,324 20,316 25,308 C 29,302 38,303 40,310" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 104,324 C 114,324 120,316 115,308 C 111,302 102,303 100,310" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Capital lower plate -->
  <rect x="50" y="322" width="40" height="8" rx="1" stroke-width="1.5"/>
  <!-- Shaft -->
  <rect x="52" y="330" width="36" height="268" stroke-width="2.2"/>
  <!-- Center groove -->
  <line x1="70" y1="332" x2="70" y2="596" stroke-width="0.8"/>
  <!-- Base molding -->
  <rect x="44" y="598" width="52" height="16" rx="1" stroke-width="2"/>
  <rect x="38" y="614" width="64" height="16" rx="1" stroke-width="2"/>
  <rect x="33" y="630" width="74" height="10" rx="1" stroke-width="1.8"/>
</g>

<!-- ═══ RIGHT COLUMN ═══ -->
<g filter="url(#glow)" stroke="white" fill="none">
  <rect x="396" y="308" width="68" height="16" rx="2" stroke-width="2.2"/>
  <path d="M 396,324 C 386,324 380,316 385,308 C 389,302 398,303 400,310" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 464,324 C 474,324 480,316 475,308 C 471,302 462,303 460,310" stroke-width="1.8" stroke-linecap="round"/>

  <rect x="412" y="330" width="36" height="268" stroke-width="2.2"/>
  <line x1="430" y1="332" x2="430" y2="596" stroke-width="0.8"/>
  <rect x="404" y="598" width="52" height="16" rx="1" stroke-width="2"/>
  <rect x="398" y="614" width="64" height="16" rx="1" stroke-width="2"/>
  <rect x="393" y="630" width="74" height="10" rx="1" stroke-width="1.8"/>
</g>

<!-- ═══ LEFT TREE + THICK WRAPPING VINE ═══ -->
<g filter="url(#glow)" stroke="white" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Main trunk — thick -->
  <path d="M 108,605 C 107,548 109,488 114,440 C 119,395 124,366 134,340 C 140,325 148,314 158,308"
        stroke-width="13"/>

  <!-- Thick vine wrapping around left column — drawn on top of column -->

        stroke-width="9"/>
  <path d="M 52,388 C 49,400 58,412 72,416 C 84,419 96,414 100,402 C 104,390 96,378 84,376 C 74,374 64,380 62,390"
        stroke-width="9"/>
  <!-- Second loop of vine: continuing down the column -->
  <path d="M 62,390 C 56,402 58,418 70,426 C 80,433 94,432 100,420"
        stroke-width="8.5"/>
  <path d="M 100,420 C 108,408 104,392 92,386"
        stroke-width="8.5"/>
  <!-- Third loop lower down -->
  <path d="M 58,450 C 54,464 60,480 74,486 C 86,491 100,486 104,474 C 108,462 100,450 88,448 C 78,446 68,452 66,462"
        stroke-width="8"/>
  <!-- Vine tail connecting to lower trunk area -->
  <path d="M 104,474 C 112,462 114,448 112,432 C 110,416 106,404 100,390"
        stroke-width="7"/>

  <!-- Main upper branch sweeping inward toward center -->
  <path d="M 158,308 C 178,296 204,288 228,290 C 250,291 264,304 262,320 C 260,334 245,342 232,338 C 220,334 216,320 224,312 C 230,305 242,306 246,314"
        stroke-width="5.5"/>

        stroke-width="5"/>

  <!-- Third decorative scroll branch -->
  <path d="M 130,395 C 146,384 165,384 174,396 C 182,407 179,422 168,428 C 158,434 144,429 140,418 C 136,408 142,398 152,398"
        stroke-width="4.5"/>

  <!-- Crescent branches lower section -->
  <path d="M 120,448 C 136,438 154,441 160,454 C 166,467 157,481 143,482" stroke-width="4"/>
  <path d="M 116,480 C 132,470 150,474 155,488 C 160,500 151,513 137,513" stroke-width="4"/>
  <path d="M 112,512 C 127,503 144,507 148,520 C 152,532 143,543 130,543" stroke-width="3.5"/>

  <!-- Small leaf clusters -->
  <path d="M 158,480 C 168,472 180,475 182,487" stroke-width="3"/>
  <path d="M 182,487 C 186,496 181,506 173,505" stroke-width="2.5"/>
  <path d="M 182,487 C 190,483 196,488 194,497" stroke-width="2.5"/>
  <path d="M 152,515 C 162,508 173,512 174,523" stroke-width="3"/>
  <path d="M 174,523 C 177,531 172,540 164,539" stroke-width="2.5"/>
  <path d="M 174,523 C 181,519 186,524 184,532" stroke-width="2.5"/>
</g>

<!-- ═══ RIGHT TREE + THICK WRAPPING VINE (mirror) ═══ -->
<g filter="url(#glow)" stroke="white" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Main trunk -->
  <path d="M 392,605 C 393,548 391,488 386,440 C 381,395 376,366 366,340 C 360,325 352,314 342,308"
        stroke-width="13"/>

  <!-- Thick vine wrapping around right column -->
  <path d="M 345,336 C 362,340 382,348 408,358 C 428,366 444,376 448,388"
        stroke-width="9"/>
  <path d="M 448,388 C 451,400 442,412 428,416 C 416,419 404,414 400,402 C 396,390 404,378 416,376 C 426,374 436,380 438,390"
        stroke-width="9"/>
  <path d="M 438,390 C 444,402 442,418 430,426 C 420,433 406,432 400,420"
        stroke-width="8.5"/>
  <path d="M 400,420 C 392,408 396,392 408,386"
        stroke-width="8.5"/>
  <path d="M 442,450 C 446,464 440,480 426,486 C 414,491 400,486 396,474 C 392,462 400,450 412,448 C 422,446 432,452 434,462"

  <path d="M 396,474 C 388,462 386,448 388,432 C 390,416 394,404 400,390"

  <!-- Secondary scroll branch -->
  <path d="M 360,358 C 342,346 320,342 300,350 C 282,358 276,376 284,392 C 292,406 308,410 322,402 C 335,394 336,378 326,368 C 318,360 304,362 300,372"

  <path d="M 384,480 C 368,470 350,474 345,488 C 340,500 349,513 363,513" stroke-width="4"/>
  <path d="M 388,512 C 373,503 356,507 352,520 C 348,532 357,543 370,543" stroke-width="3.5"/>

  <path d="M 342,480 C 332,472 320,475 318,487" stroke-width="3"/>
  <path d="M 318,487 C 314,496 319,506 327,505" stroke-width="2.5"/>
  <path d="M 318,487 C 310,483 304,488 306,497" stroke-width="2.5"/>
  <path d="M 348,515 C 338,508 327,512 326,523" stroke-width="3"/>
  <path d="M 326,523 C 323,531 328,540 336,539" stroke-width="2.5"/>
  <path d="M 326,523 C 319,519 314,524 316,532" stroke-width="2.5"/>
</g>

<!-- ═══ CENTRAL SCROLLWORK between the trees ═══ -->
<g filter="url(#glow)" stroke="white" fill="none" stroke-linecap="round">
  <!-- Top connection between the two main inward branches -->
  <path d="M 246,314 C 248,308 249,303 250,302 C 251,303 252,308 254,314" stroke-width="3"/>

  <!-- Left large scroll -->
  <path d="M 232,338 C 222,348 216,364 220,380 C 224,394 236,400 248,394 C 258,388 262,374 254,362 C 247,352 234,353 230,363 C 227,371 233,381 242,379"
        stroke-width="4"/>

  <path d="M 268,338 C 278,348 284,364 280,380 C 276,394 264,400 252,394 C 242,388 238,374 246,362 C 253,352 266,353 270,363 C 273,371 267,381 258,379"
        stroke-width="4"/>

  <!-- Connecting element between scrolls -->
  <path d="M 242,379 C 245,386 248,389 250,388 C 252,389 255,386 258,379" stroke-width="3.2"/>

  <!-- Second tier — lower scrollwork crescents -->
  <path d="M 218,392 C 212,406 214,422 224,430 C 234,438 246,434 250,424 C 254,414 248,402 238,400"
        stroke-width="3.5"/>
  <path d="M 282,392 C 288,406 286,422 276,430 C 266,438 254,434 250,424"
        stroke-width="3.5"/>

  <!-- Third tier -->
  <path d="M 210,430 C 206,444 212,458 223,462 C 234,466 245,460 248,450"
        stroke-width="3"/>
  <path d="M 290,430 C 294,444 288,458 277,462 C 266,466 255,460 252,450"
        stroke-width="3"/>
</g>

<!-- ═══ CROWN (Durin's Crown) ═══ -->
<g filter="url(#glow-strong)" stroke="white" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Crown band -->
  <rect x="216" y="206" width="68" height="14" rx="2" stroke-width="2.5"/>
  <!-- Base arch cutouts -->
  <path d="M 216,206 C 222,199 230,199 236,206" stroke-width="1.8"/>
  <path d="M 236,206 C 242,199 248,199 250,206" stroke-width="1.8"/>
  <path d="M 250,206 C 252,199 258,199 264,206" stroke-width="1.8"/>
  <path d="M 264,206 C 270,199 276,199 284,206" stroke-width="1.8"/>
  <!-- Crown points: outer-left, short, tall, CENTER-TALL, tall, short, outer-right -->
  <path d="M 219,206 L 216,178 C 215,173 217,168 220,166 C 223,164 226,166 227,170" stroke-width="2"/>
  <path d="M 229,206 L 228,188 C 227,184 229,181 232,180" stroke-width="2"/>
  <path d="M 239,206 L 237,172 C 236,167 238,162 241,161 C 244,160 246,163 246,168" stroke-width="2.2"/>
  <!-- Center tallest -->
  <path d="M 250,206 L 250,154" stroke-width="2.5"/>
  <path d="M 250,154 C 248,148 248,143 250,140 C 252,143 252,148 250,154" stroke-width="2"/>
  <path d="M 261,206 L 263,172 C 264,167 262,162 259,161 C 256,160 254,163 254,168" stroke-width="2.2"/>
  <path d="M 271,206 L 272,188 C 273,184 271,181 268,180" stroke-width="2"/>
  <path d="M 281,206 L 284,178 C 285,173 283,168 280,166 C 277,164 274,166 273,170" stroke-width="2"/>
</g>

<!-- Stars around crown -->
<g filter="url(#glow-strong)" stroke="white">
  <g transform="translate(250,134)"><line x1="-5" y1="0" x2="5" y2="0" stroke-width="2"/><line x1="0" y1="-5" x2="0" y2="5" stroke-width="2"/><line x1="-3.5" y1="-3.5" x2="3.5" y2="3.5" stroke-width="2"/><line x1="3.5" y1="-3.5" x2="-3.5" y2="3.5" stroke-width="2"/></g>
  <g transform="translate(197,175)"><line x1="-4" y1="0" x2="4" y2="0" stroke-width="1.6"/><line x1="0" y1="-4" x2="0" y2="4" stroke-width="1.6"/><line x1="-2.8" y1="-2.8" x2="2.8" y2="2.8" stroke-width="1.6"/><line x1="2.8" y1="-2.8" x2="-2.8" y2="2.8" stroke-width="1.6"/></g>
  <g transform="translate(303,175)"><line x1="-4" y1="0" x2="4" y2="0" stroke-width="1.6"/><line x1="0" y1="-4" x2="0" y2="4" stroke-width="1.6"/><line x1="-2.8" y1="-2.8" x2="2.8" y2="2.8" stroke-width="1.6"/><line x1="2.8" y1="-2.8" x2="-2.8" y2="2.8" stroke-width="1.6"/></g>
  <g transform="translate(181,195)"><line x1="-3.2" y1="0" x2="3.2" y2="0" stroke-width="1.3"/><line x1="0" y1="-3.2" x2="0" y2="3.2" stroke-width="1.3"/><line x1="-2.2" y1="-2.2" x2="2.2" y2="2.2" stroke-width="1.3"/><line x1="2.2" y1="-2.2" x2="-2.2" y2="2.2" stroke-width="1.3"/></g>
  <g transform="translate(319,195)"><line x1="-3.2" y1="0" x2="3.2" y2="0" stroke-width="1.3"/><line x1="0" y1="-3.2" x2="0" y2="3.2" stroke-width="1.3"/><line x1="-2.2" y1="-2.2" x2="2.2" y2="2.2" stroke-width="1.3"/><line x1="2.2" y1="-2.2" x2="-2.2" y2="2.2" stroke-width="1.3"/></g>
  <g transform="translate(170,217)"><line x1="-2.8" y1="0" x2="2.8" y2="0" stroke-width="1.2"/><line x1="0" y1="-2.8" x2="0" y2="2.8" stroke-width="1.2"/><line x1="-2" y1="-2" x2="2" y2="2" stroke-width="1.2"/><line x1="2" y1="-2" x2="-2" y2="2" stroke-width="1.2"/></g>
  <g transform="translate(330,217)"><line x1="-2.8" y1="0" x2="2.8" y2="0" stroke-width="1.2"/><line x1="0" y1="-2.8" x2="0" y2="2.8" stroke-width="1.2"/><line x1="-2" y1="-2" x2="2" y2="2" stroke-width="1.2"/><line x1="2" y1="-2" x2="-2" y2="2" stroke-width="1.2"/></g>
</g>

<!-- ═══ HAMMER AND ANVIL ═══ -->
<g filter="url(#glow)" stroke="white" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Hammer head -->
  <rect x="232" y="242" width="36" height="14" rx="2" stroke-width="2.2"/>
  <!-- Hammer handle -->
  <line x1="250" y1="256" x2="250" y2="274" stroke-width="3.5"/>
  <!-- Anvil top -->
  <path d="M 224,270 L 276,270" stroke-width="2.5"/>
  <!-- Anvil body -->
  <path d="M 226,270 L 224,282 L 276,282 L 274,270" stroke-width="2"/>
  <!-- Anvil horn (left) -->
  <path d="M 224,270 C 212,270 207,275 212,281 L 224,281" stroke-width="2"/>
  <!-- Anvil feet -->
  <path d="M 236,282 L 234,292 L 266,292 L 264,282" stroke-width="2"/>
  <path d="M 232,292 L 268,292" stroke-width="2"/>
</g>

<!-- ═══ STAR OF FËANOR (8-pointed) ═══ -->
<g filter="url(#glow-strong)" stroke="white" fill="none" transform="translate(250, 462)">
  <line x1="0" y1="-22" x2="0" y2="22" stroke-width="2.2"/>
  <line x1="-22" y1="0" x2="22" y2="0" stroke-width="2.2"/>
  <line x1="-15" y1="-15" x2="15" y2="15" stroke-width="2"/>
  <line x1="15" y1="-15" x2="-15" y2="15" stroke-width="2"/>
  <!-- Inner diamond -->
  <path d="M 0,-13 L 9,0 L 0,13 L -9,0 Z" stroke-width="1.6"/>
  <!-- Outer tips (elongated lozenges) -->
  <path d="M 0,-22 L 3,-14 L 0,-6" stroke-width="1.5"/>
  <path d="M 0,-22 L -3,-14 L 0,-6" stroke-width="1.5"/>
  <path d="M 0,22 L 3,14 L 0,6" stroke-width="1.5"/>
  <path d="M 0,22 L -3,14 L 0,6" stroke-width="1.5"/>
  <path d="M -22,0 L -14,3 L -6,0" stroke-width="1.5"/>
  <path d="M -22,0 L -14,-3 L -6,0" stroke-width="1.5"/>
  <path d="M 22,0 L 14,3 L 6,0" stroke-width="1.5"/>
  <path d="M 22,0 L 14,-3 L 6,0" stroke-width="1.5"/>
</g>

<!-- ═══ GATE DOOR OPENING (arch-topped void) ═══ -->
<g filter="url(#glow)" stroke="white" fill="none">
  <path d="M 108,605 C 108,565 124,530 152,508 C 176,488 208,478 235,476 L 265,476 C 292,478 324,488 348,508 C 376,530 392,565 392,605"
        stroke-width="2.5" stroke-linecap="round"/>
</g>

<!-- ═══ MAKER'S MARK (Narvi + Moria monogram) ═══ -->
<g filter="url(#glow-strong)" stroke="white" fill="none" stroke-linecap="round">
  <!-- Left character — curved descender like Tengwar Númen -->
  <path d="M 234,600 L 234,628 C 234,636 238,640 243,640 C 248,640 250,636 250,628" stroke-width="2.2"/>
  <path d="M 234,600 C 234,594 237,591 240,590 C 243,589 246,591 246,596 L 246,628 C 246,636 248,640 250,640" stroke-width="2.2"/>
  <!-- Right character — mirrored, like Tengwar Malta -->
  <path d="M 250,628 C 250,636 252,640 257,640 C 262,640 266,636 266,628 L 266,600" stroke-width="2.2"/>
  <path d="M 266,600 C 266,594 263,591 260,590 C 257,589 254,591 254,596 L 254,628 C 254,636 252,640 250,640" stroke-width="2.2"/>
</g>

</svg>
