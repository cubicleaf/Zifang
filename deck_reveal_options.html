
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans TC', system-ui, sans-serif; }
  .demo-row { display: flex; gap: 12px; padding: 16px 8px; justify-content: center; flex-wrap: wrap; }
  .phone { width: 240px; background: #f5f0e8; border-radius: 24px; overflow: hidden; border: 1.5px solid #ddd5c4; position: relative; min-height: 480px; flex-shrink: 0; }
  .label { text-align: center; font-size: 11px; color: var(--color-text-secondary); margin: 6px 0 10px; font-weight: 500; letter-spacing: 0.3px; }
  /* Shared app chrome */
  .tab-bar { background: #f5f0e8; padding: 10px 12px 6px; border-bottom: 1px solid #ddd5c4; text-align: center; font-size: 11px; color: #4682b4; font-weight: 700; letter-spacing: 0.5px; }
  .session-banner { background: rgba(70,130,180,0.1); border-bottom: 1px solid #ddd5c4; padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; }
  .progress-text { font-size: 12px; color: #4682b4; font-weight: 600; }
  .decks-btn { font-size: 11px; font-weight: 600; color: #4682b4; background: rgba(70,130,180,0.15); border: 1px solid rgba(70,130,180,0.3); border-radius: 20px; padding: 3px 10px; cursor: pointer; transition: background 0.15s; }
  .decks-btn:active { background: rgba(70,130,180,0.28); transform: scale(0.95); }
  .restart { font-size: 11px; color: #4682b4; font-weight: 600; cursor: pointer; padding: 3px 4px; }
  .mode-bar { padding: 6px 10px; border-bottom: 1px solid #ddd5c4; display: flex; align-items: center; justify-content: space-between; }
  .trash-ico { color: #c84b31; font-size: 13px; cursor: pointer; width: 28px; text-align: center; }
  .check-ico { color: #2d6a4f; font-size: 13px; cursor: pointer; width: 28px; text-align: center; }
  .seg { display: flex; background: rgba(70,130,180,0.15); border-radius: 8px; overflow: hidden; }
  .seg-btn { font-size: 11px; padding: 4px 10px; cursor: pointer; color: rgba(70,130,180,0.7); font-weight: 700; border: none; background: transparent; }
  .seg-btn.active { background: rgba(70,130,180,0.7); color: #f5f0e8; }
  .dots-row { padding: 6px 12px; border-bottom: 1px solid #ddd5c4; display: flex; gap: 3px; justify-content: center; flex-wrap: wrap; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #ebe4d6; }
  .dot.cur { background: #4682b4; transform: scale(1.3); }
  .flashcard { margin: 12px auto; width: 180px; height: 180px; background: #faf7f1; border: 1px solid #ddd5c4; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 900; color: #2c2416; cursor: pointer; font-family: 'Noto Serif TC', serif; }
  .grade-row { display: flex; gap: 6px; justify-content: center; margin-top: 8px; }
  .grade-btn { flex: 1; max-width: 88px; padding: 7px 0; border-radius: 10px; border: none; font-size: 11px; font-weight: 600; cursor: pointer; opacity: 0.5; }
  .grade-wrong { background: #c84b31; color: #faf7f1; }
  .grade-right { background: #2d6a4f; color: #faf7f1; }

  /* Chip styles shared */
  .chip { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; border: none; cursor: default; white-space: nowrap; }
  .chip-blue { background: rgba(70,130,180,0.18); color: #4682b4; }
  .chip-red { background: rgba(200,75,49,0.15); color: #c84b31; }
  .chip-ink { background: rgba(44,36,22,0.1); color: #5a4e3c; }
  .chip-gold { background: rgba(184,134,11,0.15); color: #b8860b; }

  /* OPTION A — dropdown */
  .dropdown-panel { position: absolute; top: 76px; left: 0; right: 0; background: #faf7f1; border-bottom: 1px solid #ddd5c4; padding: 8px 10px; display: flex; flex-wrap: wrap; gap: 5px; z-index: 10; transform-origin: top; transition: opacity 0.2s ease, transform 0.2s ease; }
  .dropdown-panel.hidden { opacity: 0; transform: scaleY(0); pointer-events: none; }

  /* OPTION B — bottom sheet */
  .sheet-overlay { position: absolute; inset: 0; background: rgba(44,36,22,0.4); z-index: 20; transition: opacity 0.25s ease; display: flex; align-items: flex-end; }
  .sheet-overlay.hidden { opacity: 0; pointer-events: none; }
  .sheet { background: #faf7f1; border-radius: 16px 16px 0 0; padding: 12px 12px 16px; width: 100%; transform: translateY(0); transition: transform 0.25s ease; }
  .sheet-overlay.hidden .sheet { transform: translateY(100%); }
  .sheet-handle { width: 28px; height: 3px; background: #ddd5c4; border-radius: 2px; margin: 0 auto 10px; }
  .sheet-title { font-size: 10px; color: #8a7e6c; font-weight: 600; letter-spacing: 0.5px; margin-bottom: 7px; }

  /* OPTION C — popover */
  .popover-wrap { position: absolute; top: 46px; left: 0; right: 0; display: flex; justify-content: center; z-index: 10; }
  .popover { background: #faf7f1; border: 1px solid #ddd5c4; border-radius: 12px; padding: 8px 10px; width: 200px; display: flex; flex-wrap: wrap; gap: 5px; box-shadow: 0 4px 16px rgba(44,36,22,0.12); transition: opacity 0.2s ease, transform 0.2s ease; transform-origin: top center; }
  .popover::before { content:''; position:absolute; top:-5px; left: 50%; transform: translateX(-50%); width: 9px; height: 9px; background: #faf7f1; border-left: 1px solid #ddd5c4; border-top: 1px solid #ddd5c4; transform: translateX(-50%) rotate(45deg); }
  .popover.hidden { opacity: 0; transform: scaleY(0.85); pointer-events: none; }
</style>

<div style="padding: 8px 0 4px; text-align: center; font-size: 12px; font-weight: 500; color: var(--color-text-secondary); letter-spacing: 0.3px;">Tap the Decks button in each mockup</div>

<div class="demo-row">

  <!-- OPTION A: Dropdown -->
  <div>
    <div class="label">A — inline drop-down</div>
    <div class="phone" id="phone-a">
      <div class="tab-bar">練習 Drill</div>

        <span class="progress-text">1/108</span>

      <div class="dropdown-panel hidden" id="drop-a">
        <span class="chip chip-blue">詞彙</span>

        <span class="check-ico">✓</span>
      </div>
      <div class="dots-row">
        <div class="dot cur"></div>
        <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
        <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
        <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>
      <div class="flashcard">知</div>
      <div class="grade-row">
        <button class="grade-btn grade-wrong">✗ Struggling</button>
        <button class="grade-btn grade-right">✓ Got it</button>
      </div>
    </div>
  </div>

  <!-- OPTION B: Bottom sheet -->
  <div>
    <div class="label">B — bottom sheet</div>
    <div class="phone" id="phone-b">
      <div class="tab-bar">練習 Drill</div>
      <div class="session-banner">
        <span class="progress-text">1/108</span>
        <button class="decks-btn" onclick="toggleB()">Decks ▾</button>
        <span class="restart">重來</span>
      </div>
      <div class="mode-bar">
        <span class="trash-ico">🗑</span>
        <div class="seg"><span class="seg-btn active">中→英</span><span class="seg-btn">英→中</span></div>
        <span class="check-ico">✓</span>
      </div>
      <div class="dots-row">
        <div class="dot cur"></div>
        <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
        <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
        <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>
      <div class="flashcard">識</div>
      <div class="grade-row">
        <button class="grade-btn grade-wrong">✗ Struggling</button>
        <button class="grade-btn grade-right">✓ Got it</button>
      </div>
      <div class="sheet-overlay hidden" id="sheet-b" onclick="toggleB()">
        <div class="sheet" onclick="event.stopPropagation()">
          <div class="sheet-handle"></div>
          <div class="sheet-title">ACTIVE DECKS</div>
          <div style="display:flex;flex-wrap:wrap;gap:5px;">
            <span class="chip chip-blue">詞彙</span>
            <span class="chip chip-blue">句型</span>
            <span class="chip chip-ink">表達</span>
            <span class="chip chip-red">自創</span>
            <span class="chip chip-gold">★ Favs</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- OPTION C: Popover -->
  <div>
    <div class="label">C — floating popover</div>
    <div class="phone" id="phone-c">
      <div class="tab-bar">練習 Drill</div>
      <div class="session-banner" style="position:relative;">
        <span class="progress-text">1/108</span>
        <button class="decks-btn" onclick="toggleC()">Decks ▾</button>
        <span class="restart">重來</span>
      </div>
      <div class="popover-wrap">
        <div class="popover hidden" id="pop-c">
          <span class="chip chip-blue">詞彙</span>
          <span class="chip chip-blue">句型</span>
          <span class="chip chip-ink">表達</span>
          <span class="chip chip-red">自創</span>
          <span class="chip chip-gold">★ Favs</span>
        </div>
      </div>
      <div class="mode-bar">
        <span class="trash-ico">🗑</span>
        <div class="seg"><span class="seg-btn active">中→英</span><span class="seg-btn">英→中</span></div>

      </div>
      <div class="dots-row">
        <div class="dot cur"></div>
        <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
        <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
        <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>
      <div class="flashcard">庫</div>
      <div class="grade-row">
        <button class="grade-btn grade-wrong">✗ Struggling</button>
        <button class="grade-btn grade-right">✓ Got it</button>
      </div>
    </div>
  </div>

</div>

<script>
function toggleA() {
  document.getElementById('drop-a').classList.toggle('hidden');
}
function toggleB() {
  document.getElementById('sheet-b').classList.toggle('hidden');
}
function toggleC() {
  document.getElementById('pop-c').classList.toggle('hidden');
}
document.addEventListener('click', function(e) {
  if (!e.target.closest('#phone-a')) {
    document.getElementById('drop-a').classList.add('hidden');
  }
  if (!e.target.closest('#phone-c')) {
    document.getElementById('pop-c').classList.add('hidden');
  }
});
</script>
